limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {

        listen 80;
        listen [::]:80;
        server_name ip-lookup.example.com;
        return 301 https://$host$request_uri;
}
server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    	server_name ip-lookup.example.com;

    access_log /var/log/nginx/ip-lookup.access.log;
    error_log  /var/log/nginx/ip-lookup.error.log;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "DENY"           always;
    add_header X-XSS-Protection       "1; mode=block"  always;
    add_header Referrer-Policy        "no-referrer"    always;
 
    client_max_body_size 16k;

    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/run/ip-lookup/ip-lookup.sock;
        uwsgi_read_timeout 30;
        uwsgi_send_timeout 30;
    }

    location /static/ {
        alias /opt/scripts/ip-lookup/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(php|asp|aspx|jsp|cgi|sh|py|pl|bash)$ {
        return 404;
    }
}


server {

        listen 80;
        listen [::]:80;
        server_name ip-lookup-v4.example.com;
        return 301 https://$host$request_uri;
}
server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        server_name ip-lookup-v4.example.com;

    server_tokens off;
    access_log off;
 
    limit_req zone=api burst=10 nodelay;

    location = /api/myip {
        include uwsgi_params;
        uwsgi_pass unix:/run/ip-lookup/ip-lookup.sock;
        uwsgi_read_timeout 10;
        uwsgi_send_timeout 10;

        add_header Access-Control-Allow-Origin "https://ip-lookup.example.com";
        add_header Access-Control-Allow-Methods "GET";
    }

    location / {
        return 404;
    }

}
